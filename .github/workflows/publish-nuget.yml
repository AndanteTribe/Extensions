name: Publish to Nuget
on:
    workflow_dispatch: {}
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # ghasec-ignore: unpinned-action
            - uses: AndanteTribe/Actions/actions/checkout@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
            # ghasec-ignore: unpinned-action
            - uses: AndanteTribe/Actions/actions/setup-dotnet@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
              with:
                  dotnet-version: 10.0.x
            - name: Restore
              run: dotnet restore
            - name: Build
              run: dotnet build -c Release --no-restore
            - name: Pack
              run: dotnet pack -c Release -o artifacts/
            - name: Publish to Nuget
              run: find . -type f -name "*.nupkg" -print0 | xargs -0 -I pkg dotnet nuget push pkg -k $nuget_api_key -s "https://api.nuget.org/v3/index.json" --skip-duplicate
              env:
                  nuget_api_key: ${{ secrets.NUGET_API_KEY }}
              working-directory: ./artifacts
#      - uses: actions/upload-artifact@master
#        with:
#          path: .//artifacts
#          retention-days: 2